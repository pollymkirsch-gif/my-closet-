function zoomPhoto(src){const el=document.createElement('div');el.className='zoomOverlay';el.innerHTML='<button class="btn">Close</button><div class="zoomStage"><img alt="Enlarged photo"></div><div class="row" style="justify-content:center"><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomReset">Reset</button><button class="btn" id="zoomIn">+</button></div>';document.body.appendChild(el);let img=el.querySelector('img'),stage=el.querySelector('.zoomStage'),scale=1,x=0,y=0,last=null;img.src=src;function draw(){img.style.transform=`translate(${x}px,${y}px) scale(${scale})`}el.querySelector('button').onclick=()=>el.remove();el.querySelector('#zoomIn').onclick=()=>{scale=Math.min(5,scale+.5);draw()};el.querySelector('#zoomOut').onclick=()=>{scale=Math.max(1,scale-.5);if(scale===1)x=y=0;draw()};el.querySelector('#zoomReset').onclick=()=>{scale=1;x=y=0;draw()};stage.onpointerdown=e=>{last=[e.clientX,e.clientY];stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!last||scale===1)return;x+=e.clientX-last[0];y+=e.clientY-last[1];last=[e.clientX,e.clientY];draw()};stage.onpointerup=stage.onpointercancel=()=>last=null;img.ondblclick=()=>{scale=scale===1?2:1;x=y=0;draw()}}
function shrink(file){return new Promise((resolve,reject)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1200/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=u})}function detail(id){let i=items.find(x=>x.id===id);if(!i)return;open(`<div class="row" style="justify-content:space-between"><h2>${esc(i.name)}</h2><button class="btn" onclick="closeModal()">Close</button></div>${i.photo?`<img class="detailimg" src="${i.photo}" alt="${esc(i.name)}" onclick="zoomPhoto(this.src)" style="cursor:zoom-in">`:''}<div class="detailtext"><p><b>Category:</b> ${esc(i.category)}</p><p><b>Location:</b> ${esc(i.location||'Not set')}</p>${i.brand?`<p><b>Brand:</b> ${esc(i.brand)}</p>`:''}${i.color?`<p><b>Color:</b> ${esc(i.color)}</p>`:''}<div>${(i.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>${i.notes?`<p>${esc(i.notes)}</p>`:''}</div><button class="btn primary" onclick="edit('${id}')">Edit item</button>`)}function editBoard(id,type){let b=boards.find(x=>x.id===id)||{};type=type||b.type||'outfit';photoData=b.photo||'';open(`<div class="row" style="justify-content:space-between"><h2>${id?'Edit':'Add'} ${type==='outfit'?'outfit':'inspiration'}</h2><button class="btn" onclick="closeModal()">Close</button></div><form id="boardForm"><label>Photo — select to crop before saving<input id="boardPhoto" type="file" accept="image/*"></label><img class="preview" id="boardPreview" ${photoData?`src="${photoData}" style="display:block"`:''}><button class="btn cropExisting" type="button" id="cropExistingBoard" ${photoData?'':'disabled'}>✂ Crop current photo</button><button class="btn" type="button" id="boardRemovePhoto">Remove photo</button><label>Tags (comma separated)<input id="boardTags" value="${esc((b.tags||[]).join(', '))}" placeholder="Summer, Casual, Favorite"></label><label>Notes<textarea id="boardNotes" placeholder="Outfit details or ideas…">${esc(b.notes||'')}</textarea></label><div class="row" style="margin-top:18px"><button type="submit" class="btn primary">Save</button>${id?'<button type="button" class="btn" id="boardDelete">Delete</button>':''}</div></form>`);$('boardPhoto').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{photoData=await cropPhoto(f);$('boardPreview').src=photoData;$('boardPreview').style.display='block';$('cropExistingBoard').disabled=false}catch(e){if(!e.cancelled)alert('Could not load photo: '+(e.message||'Unknown error'))}};$('cropExistingBoard').onclick=async()=>{if(!photoData)return;try{photoData=await cropSavedPhoto(photoData);$('boardPreview').src=photoData;$('boardPreview').style.display='block'}catch(err){if(!err.cancelled)alert('Could not crop photo')}};$('boardRemovePhoto').onclick=()=>{photoData='';$('boardPreview').style.display='none';$('cropExistingBoard').disabled=true};$('boardForm').onsubmit=e=>{e.preventDefault();if(!photoData)return alert('Please add a photo.');saveBoard({id:id||crypto.randomUUID(),type,name:b.name||((type==='outfit'?'Outfit ':'Inspiration ')+new Date().toLocaleDateString()),tags:$('boardTags').value.split(',').map(x=>x.trim()).filter(Boolean),notes:$('boardNotes').value.trim(),photo:photoData})};if(id)$('boardDelete').onclick=()=>{if(confirm('Delete this photo?')){deleteBoard(id);closeModal()}}}function boardDetail(id){let b=boards.find(x=>x.id===id);if(!b)return;open(`<div class="row" style="justify-content:space-between"><h2>${b.type==='outfit'?'My Outfit':'Inspiration'}</h2><button class="btn" onclick="closeModal()">Close</button></div><img class="detailimg" src="${b.photo}" alt="" onclick="zoomPhoto(this.src)" style="cursor:zoom-in"><div>${(b.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>${b.notes?`<p>${esc(b.notes)}</p>`:''}<button class="btn primary" onclick="editBoard('${b.id}')">Edit</button>`)}function manageCategories(){open(`<div class="row" style="justify-content:space-between"><h2>Edit categories</h2><button class="btn" onclick="closeModal()">Close</button></div><p class="note">Add, rename, or delete categories. Renaming updates the items in that category. To delete a category, move its items first.</p><div id="catRows"></div><form id="newCatForm" class="row" style="margin-top:16px"><input id="newCatName" placeholder="New category name" required style="flex:1;min-width:160px"><button class="btn primary">Add</button></form>`);let draw=()=>{$('catRows').innerHTML=cats.map((c,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span style="flex:1">${esc(c)} <small class="small">(${items.filter(x=>x.category===c).length})</small></span><button class="btn" data-rename="${i}">Rename</button><button class="btn" data-delete="${i}">Delete</button></div>`).join('');document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let i=+b.dataset.rename,old=cats[i],name=prompt('Rename category',old)?.trim();if(!name||name===old)return;if(cats.some(c=>c.toLowerCase()===name.toLowerCase()))return alert('That category already exists');cats[i]=name;saveCats();let changed=items.filter(x=>x.category===old);if(!changed.length){render();draw();return}let tx=db.transaction('items','readwrite');changed.forEach(x=>tx.objectStore('items').put({...x,category:name}));tx.oncomplete=()=>{items=items.map(x=>x.category===old?{...x,category:name}:x);if(filterCat===old)filterCat=name;render();draw()};tx.onerror=()=>alert('Could not update items')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let i=+b.dataset.delete,c=cats[i];if(items.some(x=>x.category===c))return alert('Move or delete items in this category before deleting it.');if(!confirm('Delete category '+c+'?'))return;cats.splice(i,1);saveCats();if(filterCat===c)filterCat='';render();draw()})};draw();$('newCatForm').onsubmit=e=>{e.preventDefault();let name=$('newCatName').value.trim();if(!name)return;if(cats.some(c=>c.toLowerCase()===name.toLowerCase()))return alert('That category already exists');cats.push(name);saveCats();$('newCatName').value='';render();draw()}}function settings(){open(`<div class="row" style="justify-content:space-between"><h2>Settings & backup</h2><button class="btn" onclick="closeModal()">Close</button></div><p class="note">Your closet is stored locally on this device, not online. Save a backup to iCloud Drive regularly so you don't lose your photos, outfits, inspiration, categories, or entries if browser data is cleared or you change phones. This is a manual backup and transfer between devices, not automatic iCloud syncing. To move changes, export on one device and restore on the other.</p><div class="settings"><button class="btn" onclick="manageCategories()">Edit categories</button><button class="btn primary" id="export">Save backup to iCloud Drive</button><button class="btn" id="importBtn">Restore from backup</button><input type="file" accept="application/json,.json" id="importFile" style="display:none"></div><p class="note">On iPhone, tap Save backup, then choose Save to Files → iCloud Drive. To restore, tap Restore from backup and choose the JSON file in Files. Restoring merges by ID; matching entries are updated. Your backup includes photos, so keep it private.</p>`);$('export').onclick=async()=>{try{let blob=new Blob([JSON.stringify({version:4,items,boards,categories:cats,exportedAt:new Date().toISOString()})],{type:'application/json'}),filename='my-closet-backup-'+new Date().toISOString().slice(0,10)+'.json';let file=new File([blob],filename,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'My Closet backup'});return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);alert('Backup downloaded. On iPhone, use Share → Save to Files → iCloud Drive to keep it safe.')}catch(err){if(err.name!=='AbortError')alert('Could not save backup: '+err.message)}};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.items))throw Error('Invalid backup');if(!confirm(`Import ${data.items.length} items?`))return;if(Array.isArray(data.categories)){cats=[...new Set([...cats,...data.categories,...data.items.map(x=>x.category).filter(Boolean)])];saveCats()}else{cats=[...new Set([...cats,...data.items.map(x=>x.category).filter(Boolean)])];saveCats()}let tx=db.transaction(['items','boards'],'readwrite');for(let i of data.items){if(i.id&&i.name&&i.category)tx.objectStore('items').put(i)}for(let b of (data.boards||[])){if(b.id&&b.name&&b.photo&&['outfit','inspiration'].includes(b.type))tx.objectStore('boards').put(b)}tx.oncomplete=()=>{closeModal();load();alert('Backup imported')};tx.onerror=()=>alert('Import failed')}catch(e){alert('Could not read backup file')}}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
